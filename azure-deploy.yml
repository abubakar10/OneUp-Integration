# Azure DevOps Pipeline for OneUp Dashboard
# Builds and deploys both frontend (React + Vite) and backend (.NET) to Azure

trigger:
  branches:
    include:
      - main
      - master

variables:
  buildConfiguration: "Release"
  azureSubscription: "YourAzureSubscriptionConnectionName" # <-- Update this to your actual Azure service connection name
  backendAppName: "oneup-dashboard-api"
  frontendAppName: "oneup-dashboard-frontend"
  resourceGroupName: "oneup-dashboard-rg"

stages:
  # ====================
  # 1️⃣ BUILD STAGE
  # ====================
  - stage: Build
    displayName: "Build Applications"
    jobs:
      # ---- Build .NET Backend ----
      - job: BuildBackend
        displayName: "Build .NET API"
        pool:
          vmImage: "ubuntu-latest"

        steps:
          - task: UseDotNet@2
            displayName: "Use .NET 8 SDK"
            inputs:
              packageType: "sdk"
              version: "8.x"

          - task: DotNetCoreCLI@2
            displayName: "Restore packages"
            inputs:
              command: "restore"
              projects: "**/OneUpDashboard.Api.csproj"

          - task: DotNetCoreCLI@2
            displayName: "Build API"
            inputs:
              command: "build"
              projects: "**/OneUpDashboard.Api.csproj"
              arguments: "--configuration $(buildConfiguration) --no-restore"

          - task: DotNetCoreCLI@2
            displayName: "Publish API"
            inputs:
              command: "publish"
              projects: "**/OneUpDashboard.Api.csproj"
              arguments: "--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/api --no-build"
              zipAfterPublish: true

          - task: PublishBuildArtifacts@1
            displayName: "Publish API Artifacts"
            inputs:
              pathToPublish: "$(Build.ArtifactStagingDirectory)/api"
              artifactName: "api"

      # ---- Build React Frontend ----
      - job: BuildFrontend
        displayName: "Build React Frontend"
        pool:
          vmImage: "ubuntu-latest"

        steps:
          - task: NodeTool@0
            displayName: "Use Node.js 18"
            inputs:
              versionSpec: "18.x"

          - script: |
              cd oneup-dashboard-frontend
              npm ci
            displayName: "Install dependencies"

          - script: |
              cd oneup-dashboard-frontend
              npm run build
            displayName: "Build frontend"

          - task: PublishBuildArtifacts@1
            displayName: "Publish Frontend Artifacts"
            inputs:
              pathToPublish: "oneup-dashboard-frontend/dist"
              artifactName: "frontend"

  # ====================
  # 2️⃣ DEPLOY STAGE
  # ====================
  - stage: Deploy
    displayName: "Deploy to Azure"
    dependsOn: Build
    condition: succeeded()
    jobs:
      # ---- Deploy API to Azure App Service ----
      - deployment: DeployBackend
        displayName: "Deploy API to Azure App Service"
        environment: "production"
        pool:
          vmImage: "ubuntu-latest"
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: api

                - task: AzureWebApp@1
                  displayName: "Deploy API to Azure App Service"
                  inputs:
                    azureSubscription: "$(azureSubscription)"
                    appType: "webApp"
                    appName: "$(backendAppName)"
                    package: "$(Pipeline.Workspace)/api"
                    appSettings: |
                      -ASPNETCORE_ENVIRONMENT "Production"
                      -ConnectionStrings__MongoDB "$(MongoDBConnectionString)"
                      -MongoDB__DatabaseName "OneUpDashboard"
                      -AzureAd__TenantId "$(AzureAdTenantId)"
                      -AzureAd__ClientId "$(AzureAdClientId)"
                      -AzureAd__ClientSecret "$(AzureAdClientSecret)"
                      -AzureAd__RedirectUri "$(AzureAdRedirectUri)"
                      -Jwt__Key "$(JwtKey)"
                      -Jwt__Issuer "$(JwtIssuer)"
                      -Jwt__Audience "$(JwtAudience)"

      # ---- Deploy Frontend to Azure Static Web App ----
      - deployment: DeployFrontend
        displayName: "Deploy Frontend to Azure Static Web Apps"
        environment: "production"
        pool:
          vmImage: "ubuntu-latest"
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: frontend

                - task: AzureStaticWebApp@0
                  displayName: "Deploy to Azure Static Web App"
                  inputs:
                    azure_static_web_apps_api_token: $(AZURE_STATIC_WEB_APPS_API_TOKEN) # Add this secret in DevOps Library
                    app_location: "oneup-dashboard-frontend"
                    output_location: "oneup-dashboard-frontend/dist"
                    skip_app_build: true
