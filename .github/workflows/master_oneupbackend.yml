name: Build and deploy ASP.Net Core app to Azure Web App - OneupBackend

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore "OneUpDashboard.Api/OneUpDashboard.Api.csproj"

      - name: Build
        run: dotnet build "OneUpDashboard.Api/OneUpDashboard.Api.csproj" --configuration Release --no-restore

      - name: Publish
        run: dotnet publish "OneUpDashboard.Api/OneUpDashboard.Api.csproj" --configuration Release --output "${{ env.DOTNET_ROOT }}/myapp" --no-build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-app
          path: ${{ env.DOTNET_ROOT }}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-app
          path: backend-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'OneupBackend'
          slot-name: 'Production'
          package: backend-app
